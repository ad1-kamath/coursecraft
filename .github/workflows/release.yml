name: Release

# Runs when a version tag is pushed. It makes a draft release, so nothing is
# public until someone reads it and presses Publish. It can also be run by hand
# on a branch to test the builds: that keeps the files as run artifacts and
# makes no release. The release description is the version's section of
# CHANGELOG.md (scripts/release-notes.sh), so write that section before tagging.
#
# File names follow the Craft suite's convention, which the in-app update check
# (craft-update) reads: coursecraft-<version>-<os>-<arch>.<ext>, the version
# without the tag's "v". macOS ships a .dmg, Windows ships the Inno Setup
# -setup.exe installer and a -portable.zip (one folder with coursecraft.exe and
# portable.txt, which tells the update check it is a portable copy), and Linux
# ships both an .AppImage and a .tar.gz archive holding one folder with
# bin/coursecraft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos }
          - { os: windows-2022, name: windows }
          - { os: ubuntu-24.04, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.name == 'macos' && 'wasm32-unknown-unknown, x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: cargo install trunk --locked
      # The player has to exist before the desktop app builds, so it ends up inside it.
      - run: cargo xtask build-player
      - run: cargo build --release -p coursecraft
      - name: Build for macOS (Intel)
        if: matrix.name == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release -p coursecraft --target x86_64-apple-darwin
      - name: Package for macOS
        if: matrix.name == 'macos'
        run: |
          scripts/package-macos.sh "${GITHUB_REF_NAME#v}" target/release/coursecraft dist
          scripts/package-macos.sh "${GITHUB_REF_NAME#v}" target/x86_64-apple-darwin/release/coursecraft dist x86_64
      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          $iscc = if ($cmd) { $cmd.Source } else { $null }
          $defaultIscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not $iscc -and (Test-Path $defaultIscc)) {
            $iscc = $defaultIscc
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) {
              $iscc = $cmd.Source
            } elseif (Test-Path $defaultIscc) {
              $iscc = $defaultIscc
            }
          }
          if (-not $iscc) { throw "ISCC.exe not found after installation" }
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart('v')
          & $iscc "/DAppVersion=$ver" "/DOutputName=coursecraft-$ver-windows-x64-setup" "/DOutputDir=$PWD\dist" "/DRepoRoot=$PWD" "packaging/windows/coursecraft.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Package for Windows (portable)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "coursecraft-$ver-windows-x64-portable"
          $root = "stage\$name"
          New-Item -ItemType Directory -Force dist, $root | Out-Null
          Copy-Item target\release\coursecraft.exe "$root\coursecraft.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, ATTRIBUTION.md $root
          Set-Content -Path "$root\portable.txt" -Value "CourseCraft portable copy. Run coursecraft.exe. To update, download the new -portable.zip and unpack it in place of this folder."
          Compress-Archive -Path $root -DestinationPath "dist\$name.zip" -Force
      - name: Package for Linux
        if: matrix.name == 'linux'
        run: |
          name="coursecraft-${GITHUB_REF_NAME#v}-linux-x86_64"
          root="stage/$name"
          mkdir -p dist "$root/bin" "$root/share/applications" "$root/share/doc/coursecraft" "$root/share/icons/hicolor/1024x1024/apps" "$root/share/mime/packages"
          cp target/release/coursecraft "$root/bin/coursecraft"
          cp LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md "$root/share/doc/coursecraft/"
          cp packaging/linux/coursecraft.desktop "$root/share/applications/coursecraft.desktop"
          cp packaging/linux/coursecraft-mime.xml "$root/share/mime/packages/coursecraft.xml"
          cp apps/coursecraft/icons/coursecraft-1024.png "$root/share/icons/hicolor/1024x1024/apps/coursecraft.png"
          tar -czf "dist/$name.tar.gz" -C stage "$name"
      - name: Package for Linux (AppImage)
        if: matrix.name == 'linux'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          out="dist/coursecraft-$ver-linux-x86_64.AppImage"
          appdir="stage/CourseCraft.AppDir"
          rm -rf "$appdir"
          mkdir -p dist "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/doc/coursecraft" "$appdir/usr/share/icons/hicolor/1024x1024/apps" "$appdir/usr/share/mime/packages"
          cp target/release/coursecraft "$appdir/usr/bin/coursecraft"
          chmod 755 "$appdir/usr/bin/coursecraft"
          cp LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md "$appdir/usr/share/doc/coursecraft/"
          cp packaging/linux/coursecraft.desktop "$appdir/coursecraft.desktop"
          cp packaging/linux/coursecraft.desktop "$appdir/usr/share/applications/coursecraft.desktop"
          cp packaging/linux/coursecraft-mime.xml "$appdir/usr/share/mime/packages/coursecraft.xml"
          cp apps/coursecraft/icons/coursecraft-1024.png "$appdir/coursecraft.png"
          cp apps/coursecraft/icons/coursecraft-1024.png "$appdir/usr/share/icons/hicolor/1024x1024/apps/coursecraft.png"
          ln -sf coursecraft.png "$appdir/.DirIcon"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          set -eu
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/coursecraft" "$@"
          EOF
          chmod 755 "$appdir/AppRun"
          desktop-file-validate "$appdir/coursecraft.desktop"

          tool_ver="1.9.1"
          tool="stage/appimagetool-x86_64.AppImage"
          tool_sha="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fsSL -o "$tool" "https://github.com/AppImage/appimagetool/releases/download/$tool_ver/appimagetool-x86_64.AppImage"
          echo "$tool_sha  $tool" | sha256sum -c -
          chmod 755 "$tool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tool" "$appdir" "$out"
          chmod 755 "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The description comes from this version's section of CHANGELOG.md;
      # the job fails if the section is missing.
      - run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum coursecraft-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          files: dist/*
