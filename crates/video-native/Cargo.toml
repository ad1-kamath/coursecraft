[package]
name = "coursecraft-video-native"
description = "CourseCraft video decoding through the operating system (L1): AVFoundation on macOS, Media Foundation on Windows. The one crate allowed to use unsafe."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
log.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMTime",
] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVPixelBufferPool"] }
objc2-av-foundation = { version = "0.3", features = [
    "objc2-core-media",
    "objc2-core-foundation",
    "objc2-core-video",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVVideoSettings",
    "AVMediaFormat",
    "AVAudioSettings",
    "block2",
] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

# This crate talks to OS frameworks, so it can't inherit `unsafe_code = "forbid"`.
# Every other workspace lint is repeated here; every unsafe block needs a SAFETY comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
