[package]
name = "coursecraft-ui-egui"
description = "CourseCraft editor UI (L6): menus, slides, canvas, panels and dialogs on egui; every change goes through engine commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
coursecraft-course.workspace = true
coursecraft-logic.workspace = true
coursecraft-media.workspace = true
coursecraft-engine.workspace = true
coursecraft-render.workspace = true
coursecraft-ai.workspace = true
coursecraft-format.workspace = true
coursecraft-playback.workspace = true
coursecraft-spell.workspace = true
egui.workspace = true
craft-ui = { workspace = true, features = ["serde"] }
craft-i18n.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
craft-metafile = { workspace = true, features = ["write"] }
kurbo.workspace = true

# Floating dock panels open in their own OS windows on the desktop; the browser has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-ui = { workspace = true, features = ["serde", "native-windows"] }

[lints]
workspace = true
