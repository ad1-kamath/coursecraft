[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "xtask/strict-lms-wasm"]
default-members = ["crates/*", "apps/coursecraft-cli", "apps/coursecraft-mcp"]

[workspace.package]
version = "0.6.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
spellbook = "0.4"
# internal
coursecraft-scorm = { path = "crates/scorm" }
coursecraft-course = { path = "crates/course" }
coursecraft-logic = { path = "crates/logic" }
coursecraft-engine = { path = "crates/engine" }
coursecraft-render = { path = "crates/render" }
coursecraft-ai = { path = "crates/ai" }
coursecraft-format = { path = "crates/format" }
coursecraft-pptx = { path = "crates/pptx" }
coursecraft-control = { path = "crates/control" }
coursecraft-lms = { path = "crates/lms" }
coursecraft-lti = { path = "crates/lti" }
coursecraft-publish = { path = "crates/publish" }
coursecraft-export = { path = "crates/export" }
coursecraft-ui-egui = { path = "crates/ui-egui" }
coursecraft-cli = { path = "apps/coursecraft-cli" }
coursecraft-mcp = { path = "apps/coursecraft-mcp" }
coursecraft-media = { path = "crates/media" }
coursecraft-playback = { path = "crates/playback" }
coursecraft-video-native = { path = "crates/video-native" }
coursecraft-xapi = { path = "crates/xapi" }
coursecraft-spell = { path = "crates/spell" }
coursecraft-strict-lms = { path = "crates/strict-lms" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ring = "0.17"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
# Craft suite UI (docs/ui/implementation.md § 0): controls, docking, icons and
# interface translations. Same craft-libs commit as DeckCraft.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "63196e66f3033a6623eb629af95a104d26986725", version = "=0.1.0" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "63196e66f3033a6623eb629af95a104d26986725", version = "=0.1.0" }
# The Craft suite's update check, prompt and self-update, as DeckCraft uses it.
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "63196e66f3033a6623eb629af95a104d26986725", version = "=0.1.0", features = ["egui"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit"] }
log = "0.4"
ehttp = "0.7"
httparse = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
rfd = "0.17"
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate"] }
rodio = "0.21"
cpal = "0.16"
skrifa = "0.44"
velato = { version = "0.12", default-features = false }
kurbo = "0.13"
peniko = "0.6"
resvg = { version = "0.49", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
semver = "1"

# The Craft suite's egui and winit fork, which craft-ui is built against (same
# commits as DeckCraft). Add an entry here when the graph gains another egui crate.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Our own crates keep file and line numbers for backtraces, without full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
